name: Update PKGBUILD

on:
  release:
    types: [published]
  # Releases made with GITHUB_TOKEN do not trigger another release workflow.
  # Follow our own successful release workflow as well.
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published stable release tag (blank = latest release)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

defaults:
  run:
    shell: bash

concurrency:
  group: update-pkgbuild
  cancel-in-progress: false

jobs:
  update:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      REQUESTED_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Install metadata tools
        run: pacman -Syu --noconfirm --needed git python github-cli
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Resolve published release
        id: release
        run: |
          if [ -n "$REQUESTED_TAG" ]; then
            [[ "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Expected a stable vX.Y.Z tag"; exit 1; }
            gh release view "$REQUESTED_TAG" --json tagName --jq .tagName > /tmp/release-tag
          else
            gh release view --json tagName --jq .tagName > /tmp/release-tag
          fi
          python - <<'PY'
          import os, pathlib, re
          tag = pathlib.Path("/tmp/release-tag").read_text().strip()
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag):
              raise SystemExit("Only stable vX.Y.Z releases are supported")
          version = tag[1:]
          current = re.search(r"^pkgver=([0-9.]+)$", pathlib.Path("PKGBUILD").read_text(), re.M).group(1)
          if tuple(map(int, version.split("."))) < tuple(map(int, current.split("."))):
              raise SystemExit("Refusing to downgrade the PKGBUILD")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("version=" + version + "\n")
          PY
      - name: Update source URL and checksum
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          python packaging/update-pkgbuild.py --repository "$GITHUB_REPOSITORY" \
            --version "$VERSION"
          useradd --create-home builder
          install -d -o builder -g builder /home/builder/metadata
          cp PKGBUILD /home/builder/metadata/
          chown builder:builder /home/builder/metadata/PKGBUILD
          runuser -u builder -- bash -c \
            'cd /home/builder/metadata && makepkg --printsrcinfo' > .SRCINFO
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/update-pkgbuild
          title: 'Update Arch package to ${{ steps.release.outputs.version }}'
          commit-message: 'chore: update Arch package to ${{ steps.release.outputs.version }}'
          body: 'Updates PKGBUILD and .SRCINFO to the published release with a pinned source SHA-256. Tests are not built or run by the package.'
          add-paths: |
            PKGBUILD
            .SRCINFO
